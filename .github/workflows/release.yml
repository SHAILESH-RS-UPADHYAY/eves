# Builds the installers on real Windows + macOS runners and keeps them as workflow artifacts.
# Publish them to the public SHAILESH-RS-UPADHYAY/eves-releases repo (source stays private):
#   gh run download <run-id> -n EVES-macos-latest -D dist/ci
#   gh release upload v1.0.0 dist/ci/EVES.dmg -R SHAILESH-RS-UPADHYAY/eves-releases --clobber
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            file: dist/EVES-Setup.exe
          - os: macos-latest
            file: dist/EVES.dmg
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false # unsigned until there is a certificate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: EVES-${{ matrix.os }}
          path: ${{ matrix.file }}
          retention-days: 7
