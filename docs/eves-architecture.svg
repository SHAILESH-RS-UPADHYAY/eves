<svg viewBox="0 0 920 300" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New',monospace" role="img" aria-label="EVES live architecture — animated data flow">
  <defs>
    <style>
      .glow{filter:url(#f)}
      .pulse{animation:pulse 1.8s ease-in-out infinite}
      .pulse2{animation:pulse 1.8s ease-in-out .6s infinite}
      .pulse3{animation:pulse 1.8s ease-in-out 1.1s infinite}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
      .blink{animation:blink 1.1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .flow{stroke-dasharray:6 10;animation:flow 1.2s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-32}}
      .scan{animation:scan 5s linear infinite}
      @keyframes scan{0%{transform:translateY(-10px);opacity:0}10%{opacity:.5}90%{opacity:.5}100%{transform:translateY(300px);opacity:0}}
      .fade{animation:fade 4s ease-in-out infinite}
      .fade2{animation:fade 4s ease-in-out 1.3s infinite}
      .fade3{animation:fade 4s ease-in-out 2.6s infinite}
      @keyframes fade{0%,100%{opacity:0}20%,70%{opacity:.55}}
      text{fill:#c9d1d9}
    </style>
    <filter id="f" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#1a1f27"/><stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#39d35312" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="920" height="300" rx="14" fill="url(#bg)"/>
  <rect width="920" height="300" rx="14" fill="url(#grid)"/>
  <rect x="1" y="1" width="918" height="298" rx="14" fill="none" stroke="#22d3ee" stroke-opacity=".25"/>

  <!-- header -->
  <text x="22" y="34" font-size="13" fill="#7ee787" font-weight="700" letter-spacing="2">▌ EVES // LIVE ARCHITECTURE</text>
  <g transform="translate(788,29)"><circle cx="0" cy="-4" r="4" fill="#ff5370" class="blink"/><text x="10" y="0" font-size="11" fill="#ff5370" letter-spacing="1">● LIVE</text></g>

  <!-- appearing/disappearing code fragments -->
  <text class="fade"  x="470" y="34" font-size="9" fill="#39d353" letter-spacing="1">0x45564553  ::  wss handshake ok</text>
  <text class="fade2" x="470" y="34" font-size="9" fill="#22d3ee" letter-spacing="1">0x4D495320  ::  pcm chunk 4096b</text>
  <text class="fade3" x="470" y="34" font-size="9" fill="#c678dd" letter-spacing="1">0x56322E31  ::  inference queued</text>

  <!-- ===== EDGES ===== -->
  <g fill="none" stroke-width="1.6">
    <line x1="70" y1="160" x2="840" y2="160" stroke="#22d3ee" stroke-opacity=".18"/>
    <line x1="70" y1="160" x2="840" y2="160" stroke="#39d353" stroke-opacity=".7" class="flow"/>
    <path d="M220,160 L300,238" stroke="#22d3ee" stroke-opacity=".3"/>
    <path d="M300,238 L380,160" stroke="#22d3ee" stroke-opacity=".3"/>
    <line x1="220" y1="96" x2="220" y2="150" stroke="#ff5370" stroke-opacity=".45" stroke-dasharray="3 4"/>
    <line x1="840" y1="150" x2="840" y2="96" stroke="#f78c6c" stroke-opacity=".4"/>
    <line x1="840" y1="170" x2="840" y2="228" stroke="#7ee787" stroke-opacity=".4"/>
  </g>

  <!-- ===== FLOWING PACKETS ===== -->
  <g class="glow">
    <circle r="3.4" fill="#39d353"><animateMotion dur="3.6s" repeatCount="indefinite" path="M70,160 L840,160"/></circle>
    <circle r="3.4" fill="#22d3ee"><animateMotion dur="3.6s" begin="0.9s" repeatCount="indefinite" path="M70,160 L840,160"/></circle>
    <circle r="3.4" fill="#ffcb6b"><animateMotion dur="3.6s" begin="1.8s" repeatCount="indefinite" path="M70,160 L840,160"/></circle>
    <circle r="3.4" fill="#c678dd"><animateMotion dur="3.6s" begin="2.7s" repeatCount="indefinite" path="M70,160 L840,160"/></circle>
    <circle r="2.8" fill="#22d3ee"><animateMotion dur="2.8s" repeatCount="indefinite" path="M220,160 L300,238 L380,160"/></circle>
    <circle r="2.6" fill="#f78c6c"><animateMotion dur="2.2s" repeatCount="indefinite" path="M840,160 L840,96"/></circle>
    <circle r="2.6" fill="#7ee787"><animateMotion dur="2.2s" begin="1s" repeatCount="indefinite" path="M840,160 L840,228"/></circle>
  </g>

  <!-- ===== NODES ===== -->
  <!-- node helper drawn inline: glow ring + core + label -->
  <g text-anchor="middle" font-size="10" letter-spacing="1" font-weight="700">
    <!-- LAUNCH -->
    <circle cx="70" cy="160" r="15" fill="#7ee78722" class="glow"/><circle cx="70" cy="160" r="7" fill="#0d1117" stroke="#7ee787" stroke-width="1.6" class="pulse"/>
    <text x="70" y="196" fill="#7ee787">LAUNCH</text>
    <!-- ELECTRON -->
    <circle cx="220" cy="160" r="15" fill="#22d3ee22" class="glow"/><circle cx="220" cy="160" r="7" fill="#0d1117" stroke="#22d3ee" stroke-width="1.6" class="pulse2"/>
    <text x="220" y="196" fill="#22d3ee">ELECTRON</text>
    <!-- AUDIO -->
    <circle cx="380" cy="160" r="15" fill="#7ee78722" class="glow"/><circle cx="380" cy="160" r="7" fill="#0d1117" stroke="#7ee787" stroke-width="1.6" class="pulse3"/>
    <text x="380" y="196" fill="#7ee787">AUDIO</text>
    <!-- DEEPGRAM -->
    <circle cx="530" cy="160" r="15" fill="#22d3ee22" class="glow"/><circle cx="530" cy="160" r="7" fill="#0d1117" stroke="#22d3ee" stroke-width="1.6" class="pulse"/>
    <text x="530" y="196" fill="#22d3ee">DEEPGRAM</text>
    <!-- GROQ -->
    <circle cx="680" cy="160" r="15" fill="#c678dd22" class="glow"/><circle cx="680" cy="160" r="8" fill="#0d1117" stroke="#c678dd" stroke-width="1.8" class="pulse2"/>
    <text x="680" y="196" fill="#c678dd">GROQ · 70B</text>
    <!-- DASHBOARD -->
    <circle cx="840" cy="160" r="15" fill="#22d3ee22" class="glow"/><circle cx="840" cy="160" r="7" fill="#0d1117" stroke="#22d3ee" stroke-width="1.6" class="pulse3"/>
    <text x="840" y="196" fill="#22d3ee">DASHBOARD</text>
    <!-- STEALTH -->
    <circle cx="220" cy="82" r="6" fill="#0d1117" stroke="#ff5370" stroke-width="1.5" class="pulse"/>
    <text x="220" y="70" fill="#ff5370" font-size="9">STEALTH</text>
    <!-- OVERLAY -->
    <circle cx="300" cy="238" r="6" fill="#0d1117" stroke="#22d3ee" stroke-width="1.5" class="pulse2"/>
    <text x="300" y="262" fill="#22d3ee" font-size="9">OVERLAY HUD</text>
    <!-- NOTION -->
    <circle cx="840" cy="82" r="6" fill="#0d1117" stroke="#f78c6c" stroke-width="1.5" class="pulse"/>
    <text x="840" y="70" fill="#f78c6c" font-size="9">NOTION</text>
    <!-- DRIVE -->
    <circle cx="840" cy="238" r="6" fill="#0d1117" stroke="#7ee787" stroke-width="1.5" class="pulse3"/>
    <text x="840" y="262" fill="#7ee787" font-size="9">DRIVE</text>
  </g>

  <!-- scanline -->
  <rect class="scan" x="1" y="0" width="918" height="2" fill="#39d353" opacity=".4"/>
</svg>
