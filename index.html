<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- media-src / connect-src must name eves-audio: explicitly: they fall back to
         default-src 'self', which blocks wavesurfer from loading recordings.
         wss://api.deepgram.com is the brain's voice input. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; media-src 'self' eves-audio: blob:; connect-src 'self' eves-audio: blob: wss://api.deepgram.com;" />
    <title>EVES</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
