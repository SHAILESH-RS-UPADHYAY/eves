appId: com.personal.eves
productName: EVES
directories:
  output: dist
  buildResources: resources

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [universal]
  darkModeSupport: true

# Fixed names so the website can link straight to releases/latest/download/<file>
dmg:
  artifactName: EVES.${ext}

win:
  signAndEditExecutable: false   # no cert; also avoids winCodeSign symlink errors on Windows
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: EVES-Setup.${ext}

publish: null

files:
  - out/**/*
  - node_modules/**/*
  - package.json
